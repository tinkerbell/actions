name: Release
on:
  push:
    branches:
      - "main"
  workflow_dispatch: {}

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        action:
          - archive2disk
          - cexec
          - cidataio
          - grub2disk
          - image2disk
          - kexec
          - oci2disk
          - qemuimg2disk
          - rootio
          - slurp
          - syslinux
          - taloscmdline
          - talosmeta
          - ubootenv
          - writefile
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set Registry
        id: registry
        run: |
          if [ -n "${{ secrets.QUAY_USERNAME }}" ] && [ -n "${{ secrets.QUAY_PASSWORD }}" ]; then
            echo "registry=quay.io" >> $GITHUB_OUTPUT
          else
            echo "registry=ghcr.io" >> $GITHUB_OUTPUT
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.registry.outputs.registry }}
          username: ${{ secrets.QUAY_USERNAME || github.actor }}
          password: ${{ secrets.QUAY_PASSWORD || github.token }}

      - name: Prepare Release
        run: make prepare-release
        env:
          CONTAINER_REPOSITORY: ${{ steps.registry.outputs.registry }}/${{ github.repository }}

      - name: Run Release
        run: make release-${{ matrix.action }} -j $(nproc)
        env:
          CONTAINER_REPOSITORY: ${{ steps.registry.outputs.registry }}/${{ github.repository }}
